# Simulation tuning, NOT measured Arctos hardware ratings.
# Revolute units: rad/s and rad/s^2; prismatic units: m/s and m/s^2.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1
joint_limits:
  joint_1: &arm_limits
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint_2: *arm_limits
  joint_3: *arm_limits
  joint_4: *arm_limits
  joint_5: *arm_limits
  joint_6: *arm_limits
  jaw1: &jaw_limits
    has_velocity_limits: true
    max_velocity: 0.01
    has_acceleration_limits: true
    max_acceleration: 0.02
  jaw2: *jaw_limits
